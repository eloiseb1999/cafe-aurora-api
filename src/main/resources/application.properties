# ===== Banco de dados H2 (relacional, arquivo local, sem precisar instalar nada) =====
spring.datasource.url=jdbc:h2:file:./data/cafeauroradb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Cria/atualiza as tabelas automaticamente a partir das entidades JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true

# Console web do H2 (opcional, para ver as tabelas pelo navegador em http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Porta da aplicacao
server.port=8080

